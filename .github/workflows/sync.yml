name: Spotify Logger Sync
run-name: ${{ inputs.test_email && 'TEST — Spotify Logger email alert' || inputs.health_only && 'Spotify Logger — health check' || 'Spotify Logger — collection' }}

on:
  workflow_dispatch:
    inputs:
      implementation:
        description: Collector implementation (TypeScript is retained for rollback)
        type: choice
        options: [python, typescript]
        default: python
      dry_run:
        description: Python shadow validation without log, cache or cursor writes
        type: boolean
        default: false
      test_email:
        description: Intentionally fail once to test GitHub email alerts (no collection)
        type: boolean
        default: false
      health_only:
        description: Alert if no successful collection was recorded for 30 minutes
        type: boolean
        default: false
      check_only:
        description: Verify Spotify connection without collecting log rows
        type: boolean
        default: false

permissions:
  contents: read

# All dispatches, reruns and branches share one group. Never cancel an active writer.
# Keep this group when editing or renaming the workflow.
concurrency:
  group: spotify-logger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: inputs.implementation != 'python'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Node dependencies
        if: inputs.implementation != 'python'
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: inputs.implementation == 'python'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked Python dependencies
        if: inputs.implementation == 'python'
        run: python -m pip install -r requirements.txt
      - name: Validate Python collector
        if: inputs.implementation == 'python'
        run: python -m unittest discover -s tests_py -v
      - name: Collect Spotify history
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          USER_SHEET_ID: ${{ secrets.USER_SHEET_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          CHECK_ONLY: ${{ inputs.check_only }}
          HEALTH_ONLY: ${{ inputs.health_only }}
          TEST_EMAIL: ${{ inputs.test_email }}
          IMPLEMENTATION: ${{ inputs.implementation }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$TEST_EMAIL" == "true" ]]; then
            echo "::error::TEST email alert: intentional failure; listening data and credentials were not changed."
            exit 1
          elif [[ "$IMPLEMENTATION" == "python" ]]; then
            if [[ "$HEALTH_ONLY" == "true" ]]; then
              python -m spotify_logger health
            elif [[ "$CHECK_ONLY" == "true" ]]; then
              python -m spotify_logger check
            elif [[ "$DRY_RUN" == "true" ]]; then
              python -m spotify_logger dry-run
            else
              python -m spotify_logger sync
            fi
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "Shadow mode requires implementation=python."
            exit 1
          elif [[ "$HEALTH_ONLY" == "true" ]]; then
            npm run sync -- --health
          elif [[ "$CHECK_ONLY" == "true" ]]; then
            npm run sync -- --check
          else
            npm run sync
          fi
