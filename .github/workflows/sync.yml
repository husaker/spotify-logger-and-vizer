name: Spotify Logger Sync
run-name: ${{ inputs.test_email && 'TEST — Spotify Logger email alert' || inputs.health_only && 'Spotify Logger — health check' || 'Spotify Logger — collection' }}

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: Intentionally fail once to test GitHub email alerts (no collection)
        type: boolean
        default: false
      health_only:
        description: Alert if no successful collection was recorded for 30 minutes
        type: boolean
        default: false
      check_only:
        description: Verify Spotify connection without collecting log rows
        type: boolean
        default: false

permissions:
  contents: read

# All dispatches, reruns and branches share one group. Never cancel an active writer.
# Keep this group when editing or renaming the workflow.
concurrency:
  group: spotify-logger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Collect Spotify history
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          USER_SHEET_ID: ${{ secrets.USER_SHEET_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only }}
          HEALTH_ONLY: ${{ inputs.health_only }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [[ "$TEST_EMAIL" == "true" ]]; then
            echo "::error::TEST email alert: intentional failure; listening data and credentials were not changed."
            exit 1
          elif [[ "$HEALTH_ONLY" == "true" ]]; then
            npm run sync -- --health
          elif [[ "$CHECK_ONLY" == "true" ]]; then
            npm run sync -- --check
          else
            npm run sync
          fi
