name: Spotify Logger Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-logger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run protected sync
        env:
          SYNC_URL: https://spotify.daniildovbii.site/api/cron/sync
          CRON_SECRET: ${{ secrets.SPOTIFY_LOGGER_CRON_SECRET }}
        shell: bash
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "Required repository secret SPOTIFY_LOGGER_CRON_SECRET is missing."
            exit 1
          fi

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "$SYNC_URL")"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Spotify sync request failed with HTTP ${status}."
            exit 1
          fi

          echo "Spotify sync completed successfully."
